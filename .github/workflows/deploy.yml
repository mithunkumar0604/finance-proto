name: Release checks

# Cloudflare builds and publishes the site itself, straight from the Git branch it is
# connected to (see wrangler.jsonc and DEPLOYMENT.md). This workflow does not publish
# anything: it runs the full checks and the browser tests for the same commit, so a
# problem shows up here as a red mark beside it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    uses: ./.github/workflows/e2e.yml

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - name: Build as Cloudflare does, and refuse a build that is not connected or leaks a secret
        run: npm run build && node scripts/check-live-build.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BUSINESS_NAME: ${{ vars.NEXT_PUBLIC_BUSINESS_NAME }}
          NEXT_PUBLIC_LOGIN_EMAIL_DOMAIN: ${{ vars.NEXT_PUBLIC_LOGIN_EMAIL_DOMAIN }}
